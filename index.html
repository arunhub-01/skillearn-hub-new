<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillEarn Hub</title>
  <style>
    * {
  box-sizing: border-box;
}

:root {
  --primary: #635bff;
  --primary-dark: #4f46e5;
  --text: #172033;
  --muted: #64748b;
  --surface: #ffffff;
  --background: #f5f7ff;
  --border: #e5e9f5;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse at top left, #e6eaff 0, transparent 45%),
    var(--background);
  line-height: 1.6;
}

header {
  background: rgba(18, 25, 58, 0.97);
  color: white;
  padding: 22px clamp(18px, 6vw, 80px);
  border-bottom: 1px solid rgba(255,255,255,0.12);
}

header h1 {
  margin: 0;
  font-size: clamp(25px, 4vw, 34px);
  letter-spacing: -0.8px;
}

header p {
  margin: 5px 0 0;
  color: #c7d2fe;
}

main {
  width: min(1120px, 100%);
  margin: 0 auto;
  padding: 36px 22px 64px;
}

.hero {
  position: relative;
  overflow: hidden;
  padding: clamp(28px, 6vw, 60px);
  margin-bottom: 42px;
  border-radius: 26px;
  color: white;
  background: linear-gradient(125deg, #4338ca, #7067ff 58%, #a78bfa);
  box-shadow: 0 20px 50px rgba(79, 70, 229, 0.2);
}

.hero::after {
  content: "✦";
  position: absolute;
  right: 8%;
  top: 0;
  font-size: clamp(100px, 20vw, 220px);
  line-height: 1.2;
  color: rgba(255,255,255,0.12);
  pointer-events: none;
}

.hero h2 {
  position: relative;
  z-index: 1;
  max-width: 650px;
  margin: 0 0 12px;
  font-size: clamp(27px, 5vw, 43px);
  line-height: 1.2;
  letter-spacing: -1px;
}

.hero p {
  position: relative;
  z-index: 1;
  max-width: 580px;
  margin: 0;
  color: #eeedff;
  font-size: 17px;
}

main > h2 {
  margin: 0 0 20px;
  font-size: clamp(23px, 3vw, 30px);
  letter-spacing: -0.5px;
}

.skills {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
}

.card {
  min-width: 0;
  padding: 25px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: 0 5px 18px rgba(34, 48, 90, 0.045);
  transition: transform 180ms ease, box-shadow 180ms ease,
    border-color 180ms ease;
}

.card:hover {
  transform: translateY(-5px);
  border-color: #c7c5ff;
  box-shadow: 0 16px 34px rgba(55, 48, 163, 0.12);
}

.card h3 {
  margin: 0 0 18px;
  font-size: 20px;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.card button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 11px 18px;
  border: 0;
  border-radius: 11px;
  background: var(--primary);
  color: white;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 5px 12px rgba(99, 91, 255, 0.2);
  transition: background 180ms ease, transform 180ms ease;
}

.card button:hover {
  background: var(--primary-dark);
  transform: translateY(-1px);
}

button:focus-visible {
  outline: 3px solid #a5b4fc;
  outline-offset: 3px;
}

#message {
  margin-top: 26px;
  padding: 22px;
  border: 1px solid #d9ddff;
  border-radius: 16px;
  background: white;
  box-shadow: 0 8px 25px rgba(34, 48, 90, 0.06);
  overflow-wrap: anywhere;
}

@media (max-width: 850px) {
  .skills {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
  }

  .card {
    padding: 21px;
  }
}

@media (max-width: 520px) {
  main {
    padding: 24px 15px 44px;
  }

  header {
    padding: 20px;
  }

  .hero {
    padding: 30px 23px;
    border-radius: 20px;
    margin-bottom: 32px;
  }

  .hero p {
    font-size: 15px;
  }

  .skills {
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
  }

  .card {
    padding: 22px;
    border-radius: 16px;
  }

  .card button {
    width: 100%;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}
  </style>
</head>
<body>
  <header>
    <h1>SkillEarn Hub</h1>
    <p>Learn useful skills. Build your future.</p>
  </header>

  <main>
    <section class="hero">
      <h2>Welcome to SkillEarn Hub 🚀</h2>
      <p>Choose a skill and start learning at your own pace.</p>
    </section>

    <h2>Explore Skills</h2>
    <section class="skills" id="skills"></section>
    <section id="message" aria-live="polite"></section>
  </main>

  <script>
    const skills = [
      "Web Design",
      "Video Editing",
      "Excel & Data Entry",
      "AI Tools",
      "Graphic Design",
      "Web Development",
      "Freelancing"
    ];

    const skillsContainer = document.getElementById("skills");
    const message = document.getElementById("message");

    skills.forEach(function(skill) {
      const card = document.createElement("article");
      card.className = "card";

      const details = {
  "Web Design": ["🎨", "Beautiful websites ka design seekho."],
  "Video Editing": ["🎬", "Reels aur videos edit karna seekho."],
  "Excel & Data Entry": ["📊", "Excel aur data entry skills seekho."],
  "AI Tools": ["🤖", "AI tools se smart work karna seekho."],
  "Graphic Design": ["🖌️", "Posters aur creative designs banao."],
  "Web Development": ["💻", "Websites banana seekho."],
  "Freelancing": ["💼", "Online clients aur projects paana seekho."]
};

const info = details[skill] || ["✨", "Nayi skill seekhna shuru karo."];

const icon = document.createElement("div");
icon.textContent = info[0];
icon.style.fontSize = "36px";
icon.style.marginBottom = "12px";

const title = document.createElement("h3");
title.textContent = skill;

const description = document.createElement("p");
description.textContent = info[1];
description.style.color = "#64748b";
description.style.marginBottom = "20px";

card.appendChild(icon);
card.appendChild(title);
card.appendChild(description);

      const button = document.createElement("button");
      button.textContent = "Start Learning";

      button.addEventListener("click", function() {
        message.style.display = "block";
        message.textContent = "Welcome to " + skill + "! Lessons are coming soon.";
        message.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });

      card.appendChild(title);
      card.appendChild(button);
      skillsContainer.appendChild(card);
    });
  </script>
</body>
</html>
