<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillEarn Hub</title>
  <style>
    * {
  box-sizing: border-box;
}

:root {
  --primary: #635bff;
  --primary-dark: #4f46e5;
  --text: #172033;
  --muted: #64748b;
  --surface: #ffffff;
  --background: #f5f7ff;
  --border: #e5e9f5;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse at top left, #e6eaff 0, transparent 45%),
    var(--background);
  line-height: 1.6;
}

header {
  background: rgba(18, 25, 58, 0.97);
  color: white;
  padding: 22px clamp(18px, 6vw, 80px);
  border-bottom: 1px solid rgba(255,255,255,0.12);
}

header h1 {
  margin: 0;
  font-size: clamp(25px, 4vw, 34px);
  letter-spacing: -0.8px;
}

header p {
  margin: 5px 0 0;
  color: #c7d2fe;
}

main {
  width: min(1120px, 100%);
  margin: 0 auto;
  padding: 36px 22px 64px;
}

.hero {
  position: relative;
  overflow: hidden;
  padding: clamp(28px, 6vw, 60px);
  margin-bottom: 42px;
  border-radius: 26px;
  color: white;
  background: linear-gradient(125deg, #4338ca, #7067ff 58%, #a78bfa);
  box-shadow: 0 20px 50px rgba(79, 70, 229, 0.2);
}

.hero::after {
  content: "✦";
  position: absolute;
  right: 8%;
  top: 0;
  font-size: clamp(100px, 20vw, 220px);
  line-height: 1.2;
  color: rgba(255,255,255,0.12);
  pointer-events: none;
}

.hero h2 {
  position: relative;
  z-index: 1;
  max-width: 650px;
  margin: 0 0 12px;
  font-size: clamp(27px, 5vw, 43px);
  line-height: 1.2;
  letter-spacing: -1px;
}

.hero p {
  position: relative;
  z-index: 1;
  max-width: 580px;
  margin: 0;
  color: #eeedff;
  font-size: 17px;
}

main > h2 {
  margin: 0 0 20px;
  font-size: clamp(23px, 3vw, 30px);
  letter-spacing: -0.5px;
}

.skills {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
}

.card {
  min-width: 0;
  padding: 25px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: 0 5px 18px rgba(34, 48, 90, 0.045);
  transition: transform 180ms ease, box-shadow 180ms ease,
    border-color 180ms ease;
}

.card:hover {
  transform: translateY(-5px);
  border-color: #c7c5ff;
  box-shadow: 0 16px 34px rgba(55, 48, 163, 0.12);
}

.card h3 {
  margin: 0 0 18px;
  font-size: 20px;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.card button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 11px 18px;
  border: 0;
  border-radius: 11px;
  background: var(--primary);
  color: white;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 5px 12px rgba(99, 91, 255, 0.2);
  transition: background 180ms ease, transform 180ms ease;
}

.card button:hover {
  background: var(--primary-dark);
  transform: translateY(-1px);
}

button:focus-visible {
  outline: 3px solid #a5b4fc;
  outline-offset: 3px;
}

#message {
  margin-top: 26px;
  padding: 22px;
  border: 1px solid #d9ddff;
  border-radius: 16px;
  background: white;
  box-shadow: 0 8px 25px rgba(34, 48, 90, 0.06);
  overflow-wrap: anywhere;
}

@media (max-width: 850px) {
  .skills {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
  }

  .card {
    padding: 21px;
  }
}

@media (max-width: 520px) {
  main {
    padding: 24px 15px 44px;
  }

  header {
    padding: 20px;
  }

  .hero {
    padding: 30px 23px;
    border-radius: 20px;
    margin-bottom: 32px;
  }

  .hero p {
    font-size: 15px;
  }

  .skills {
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
  }

  .card {
    padding: 22px;
    border-radius: 16px;
  }

  .card button {
    width: 100%;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}
.skill-controls {
  display: flex;
  gap: 12px;
  margin: 0 0 12px;
  flex-wrap: wrap;
}

.skill-controls input,
.skill-controls select {
  min-height: 48px;
  padding: 12px 15px;
  border: 1px solid #d9deec;
  border-radius: 12px;
  background: white;
  color: #172033;
  font: inherit;
}

.skill-controls input {
  flex: 1;
  min-width: 200px;
}

.skill-controls select {
  min-width: 190px;
}

#resultCount {
  color: #64748b;
  font-size: 14px;
  margin: 0 0 16px;
}

@media (max-width: 520px) {
  .skill-controls {
    flex-direction: column;
  }

  .skill-controls input,
  .skill-controls select {
    width: 100%;
  }
}    
  </style>
</head>
<body>
  <header>
    <h1>SkillEarn Hub</h1>
    <p>Learn useful skills. Build your future.</p>
  </header>

  <main>
    <section class="hero">
      <h2>Welcome to SkillEarn Hub 🚀</h2>
      <p>Choose a skill and start learning at your own pace.</p>
    </section>

<h2>Explore Skills</h2>

<div class="skill-controls">
  <input
    type="search"
    id="skillSearch"
    placeholder="🔎 Search skills..."
    aria-label="Search skills"
  />

  <select id="categoryFilter" aria-label="Filter skills by category">
    <option value="all">All Categories</option>
    <option value="design">Design</option>
    <option value="technology">Technology</option>
    <option value="business">Business</option>
  </select>
</div>

<p id="resultCount" aria-live="polite"></p>

<section class="skills" id="skills"></section>
    <section id="message" aria-live="polite"></section>
  </main>

  <script>
    const skills = [
      "Web Design",
      "Video Editing",
      "Excel & Data Entry",
      "AI Tools",
      "Graphic Design",
      "Web Development",
      "Freelancing"
    ];

    const skillsContainer = document.getElementById("skills");
    const message = document.getElementById("message");

    skills.forEach(function(skill) {
      const card = document.createElement("article");
      card.className = "card";

      const details = {
  "Web Design": ["🎨", "Beautiful websites ka design seekho."],
  "Video Editing": ["🎬", "Reels aur videos edit karna seekho."],
  "Excel & Data Entry": ["📊", "Excel aur data entry skills seekho."],
  "AI Tools": ["🤖", "AI tools se smart work karna seekho."],
  "Graphic Design": ["🖌️", "Posters aur creative designs banao."],
  "Web Development": ["💻", "Websites banana seekho."],
  "Freelancing": ["💼", "Online clients aur projects paana seekho."]
};

const info = details[skill] || ["✨", "Nayi skill seekhna shuru karo."];

const icon = document.createElement("div");
icon.textContent = info[0];
icon.style.fontSize = "36px";
icon.style.marginBottom = "12px";

const title = document.createElement("h3");
title.textContent = skill;

const description = document.createElement("p");
description.textContent = info[1];
description.style.color = "#64748b";
description.style.marginBottom = "20px";

card.appendChild(icon);
card.appendChild(title);
card.appendChild(description);

      const button = document.createElement("button");
      button.textContent = "Start Learning";

      button.addEventListener("click", function() {
        message.style.display = "block";
        message.textContent = "Welcome to " + skill + "! Lessons are coming soon.";
        message.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });

      card.appendChild(title);
      card.appendChild(button);
      skillsContainer.appendChild(card);
    });
    const skillSearch = document.getElementById("skillSearch");
const categoryFilter = document.getElementById("categoryFilter");
const resultCount = document.getElementById("resultCount");

function filterSkills() {
  const searchText = skillSearch.value.toLowerCase().trim();
  const category = categoryFilter.value;
  const cards = skillsContainer.querySelectorAll(".card");
  let visibleCount = 0;

  cards.forEach(function(card) {
    const title = card.querySelector("h3");
    const name = title ? title.textContent.toLowerCase() : "";

    let cardCategory = "business";

    if (name.includes("design")) {
      cardCategory = "design";
    } else if (
      name.includes("web") ||
      name.includes("ai tools") ||
      name.includes("excel") ||
      name.includes("data entry") ||
      name.includes("video editing")
    ) {
      cardCategory = "technology";
    }

    const matchesSearch = name.includes(searchText);
    const matchesCategory =
      category === "all" || category === cardCategory;

    card.style.display =
      matchesSearch && matchesCategory ? "" : "none";

    if (matchesSearch && matchesCategory) {
      visibleCount++;
    }
  });

  resultCount.textContent =
    "Showing " + visibleCount + " of " + cards.length + " skills";
}

skillSearch.addEventListener("input", filterSkills);
categoryFilter.addEventListener("change", filterSkills);
filterSkills();
    const lessonData = {
  "Web Design": [
    { title: "Lesson 1: Web Design kya hai?", content: "Web design mein website ka layout, colours, fonts aur page structure plan kiya jata hai. Achhe design mein readability aur simple navigation important hain.", task: "Practice: Ek website ke 3 sections likho — Header, Main Content aur Footer." },
    { title: "Lesson 2: HTML Basics", content: "HTML website ka structure banata hai. Common tags: h1 heading ke liye, p paragraph ke liye, a link ke liye aur img image ke liye use hota hai.", task: "Practice: HTML mein ek heading aur ek paragraph banao." },
    { title: "Lesson 3: CSS Basics", content: "CSS website ko style karta hai. Isse colours, spacing, borders aur layouts badal sakte ho. Example: h1 { color: blue; }", task: "Practice: Apni heading ka colour badlo." }
  ],
  "Video Editing": [
    { title: "Lesson 1: Editing Basics", content: "Video editing mein clips ko arrange, trim aur combine kiya jata hai. Pehle project ratio select karo: Reels aur Shorts ke liye aam taur par 9:16.", task: "Practice: CapCut mein 3 clips import karke timeline par arrange karo." },
    { title: "Lesson 2: Cuts and Transitions", content: "Trim se clip ki length kam hoti hai. Split se clip alag parts mein divide hoti hai. Transitions ko limited aur purpose ke saath use karo.", task: "Practice: Ek clip split karo aur unwanted part remove karo." },
    { title: "Lesson 3: Audio and Export", content: "Music aur voice ka volume balance karo. Export se pehle video preview karo. Social videos ke liye 1080p aur suitable frame rate choose kar sakte ho.", task: "Practice: Music add karke 10-second sample export karo." }
  ],
  "Excel & Data Entry": [
    { title: "Lesson 1: Spreadsheet Basics", content: "Excel mein rows numbers se aur columns letters se identify hote hain. Cell jaise A1 ek row aur column ke intersection ko kehte hain.", task: "Practice: Name, Department aur Salary ke columns banao." },
    { title: "Lesson 2: Basic Formulas", content: "Formula hamesha = se start hota hai. =SUM(C2:C6) values ko add karta hai. =AVERAGE(C2:C6) average nikalta hai.", task: "Practice: 5 numbers enter karke SUM aur AVERAGE lagao." },
    { title: "Lesson 3: Sort and Filter", content: "Sort data ko order mein arrange karta hai. Filter sirf matching rows dikhata hai. Data ko check karna aur spelling consistent rakhna bhi zaroori hai.", task: "Practice: Salary ko largest-to-smallest sort karo." }
  ],
  "AI Tools": [
    { title: "Lesson 1: AI Basics", content: "AI tools writing, ideas, research aur planning mein help kar sakte hain. Output galat bhi ho sakta hai, isliye important facts verify karo.", task: "Practice: AI se ek study timetable banwane ka prompt likho." },
    { title: "Lesson 2: Prompt Writing", content: "Achhe prompt mein task, context, format aur constraints clear hote hain. Example: 'Beginner ke liye 5-point Excel guide Hindi mein likho.'", task: "Practice: Apni pasand ke topic par clear prompt banao." },
    { title: "Lesson 3: Verify the Output", content: "AI ke answers ko reliable sources se check karo. Passwords, private documents aur sensitive information public AI tools mein share mat karo.", task: "Practice: AI ke ek factual answer ko trusted source se verify karo." }
  ],
  "Graphic Design": [
    { title: "Lesson 1: Design Principles", content: "Strong design mein hierarchy, contrast, alignment aur spacing important hote hain. Viewer ko sabse pehle kya dikhna chahiye, ye decide karo.", task: "Practice: Ek poster ka main heading aur supporting text plan karo." },
    { title: "Lesson 2: Colours and Fonts", content: "Limited colour palette use karo aur text readable rakho. Heading aur body ke liye do complementary fonts se shuru kar sakte ho.", task: "Practice: Ek poster ke liye 3 colours choose karo." },
    { title: "Lesson 3: Create a Poster", content: "Poster mein clear heading, relevant visual aur useful information rakho. Export karne se pehle spelling, alignment aur image quality check karo.", task: "Practice: Ek event ya gaming poster design karo." }
  ],
  "Web Development": [
    { title: "Lesson 1: HTML Structure", content: "HTML page mein aam taur par doctype, html, head aur body elements hote hain. Visible page content body ke andar hota hai.", task: "Practice: Ek page banao jisme heading aur paragraph ho." },
    { title: "Lesson 2: CSS and Layout", content: "CSS colours, spacing aur layout control karta hai. Flexbox aur Grid se responsive layouts banaye ja sakte hain.", task: "Practice: Do cards ko CSS Grid se side-by-side dikhao." },
    { title: "Lesson 3: JavaScript Basics", content: "JavaScript page ko interactive banata hai, jaise button click par message dikhana. Browser console errors dhoondhne mein help karta hai.", task: "Practice: Button click par ek welcome message dikhane ka demo banao." }
  ],
  "Freelancing": [
    { title: "Lesson 1: Choose a Service", content: "Ek clear service choose karo, jaise short-form video editing, data entry ya graphic design. Client ko batao ki tum kya deliver karoge.", task: "Practice: Apni service aur ideal client ek sentence mein likho." },
    { title: "Lesson 2: Build a Portfolio", content: "Portfolio mein apne best sample projects, service details aur contact method rakho. Sirf apna asli work dikhana aur client permission ka dhyan rakhna.", task: "Practice: Apne best 3 sample projects ki list banao." },
    { title: "Lesson 3: Find Clients", content: "Relevant clients ko personalised message bhejo, unki needs samjho aur clear price, deadline aur revisions agree karo. Payment aur scope pehle confirm karo.", task: "Practice: Ek potential client ke liye short, professional pitch likho." }
  ]
};

const lessonPanel = document.createElement("section");
lessonPanel.id = "lessonPanel";
lessonPanel.style.cssText = "display:none; margin:24px 0; padding:24px; background:#fff; color:#172033; border:1px solid #d9deec; border-radius:16px; box-shadow:0 8px 24px #00000010;";

lessonPanel.innerHTML = `
  <h2 id="lessonSkill"></h2>
  <p id="lessonProgress"></p>
  <h3 id="lessonTitle"></h3>
  <p id="lessonContent" style="line-height:1.8; white-space:pre-line"></p>
  <p id="lessonTask" style="background:#eef2ff; padding:14px; border-radius:10px; line-height:1.6"></p>
  <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:18px">
    <button type="button" id="prevLesson">← Previous</button>
    <button type="button" id="nextLesson">Next →</button>
    <button type="button" id="closeLessons">Close Lessons</button>
  </div>
`;

skillsContainer.insertAdjacentElement("afterend", lessonPanel);

let currentSkill = "";
let currentLesson = 0;

function showLesson() {
  const lessons = lessonData[currentSkill];
  const lesson = lessons[currentLesson];

  lessonPanel.style.display = "block";
  document.getElementById("lessonSkill").textContent = currentSkill;
  document.getElementById("lessonProgress").textContent =
    "Lesson " + (currentLesson + 1) + " of " + lessons.length;
  document.getElementById("lessonTitle").textContent = lesson.title;
  document.getElementById("lessonContent").textContent = lesson.content;
  document.getElementById("lessonTask").textContent = lesson.task;

  document.getElementById("prevLesson").disabled = currentLesson === 0;
  document.getElementById("nextLesson").textContent =
    currentLesson === lessons.length - 1 ? "Finish ✓" : "Next →";

  lessonPanel.scrollIntoView({ behavior: "smooth", block: "start" });
}

skillsContainer.querySelectorAll(".card").forEach(function(card) {
  const title = card.querySelector("h3");
  const button = card.querySelector("button");

  if (!title || !button || !lessonData[title.textContent]) return;

  button.addEventListener("click", function() {
    currentSkill = title.textContent;
    currentLesson = 0;
    showLesson();
  });
});

document.getElementById("prevLesson").addEventListener("click", function() {
  if (currentLesson > 0) {
    currentLesson--;
    showLesson();
  }
});

document.getElementById("nextLesson").addEventListener("click", function() {
  if (currentLesson < lessonData[currentSkill].length - 1) {
    currentLesson++;
    showLesson();
  } else {
    document.getElementById("lessonProgress").textContent =
      "All lessons completed for " + currentSkill + "! 🎉";
    document.getElementById("nextLesson").disabled = true;
  }
});

document.getElementById("closeLessons").addEventListener("click", function() {
  lessonPanel.style.display = "none";
  document.getElementById("nextLesson").disabled = false;
});
  </script>
</body>
</html>
