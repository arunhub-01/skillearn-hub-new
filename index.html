<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillEarn Hub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #182238;
    }
    header {
      background: #14213d;
      color: white;
      padding: 22px 7%;
    }
    header h1 { margin: 0; }
    header p { margin-bottom: 0; color: #dbeafe; }
    main { max-width: 1050px; margin: auto; padding: 28px 18px; }
    .hero {
      background: white;
      padding: 28px;
      border-radius: 16px;
      margin-bottom: 24px;
    }
    .skills {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
    }
    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      border: 1px solid #e1e7f0;
    }
    .card h3 { margin-top: 0; }
    .card button {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 11px 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    #message {
      margin-top: 20px;
      background: white;
      padding: 18px;
      border-radius: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>SkillEarn Hub</h1>
    <p>Learn useful skills. Build your future.</p>
  </header>

  <main>
    <section class="hero">
      <h2>Welcome to SkillEarn Hub 🚀</h2>
      <p>Choose a skill and start learning at your own pace.</p>
    </section>

    <h2>Explore Skills</h2>
    <section class="skills" id="skills"></section>
    <section id="message" aria-live="polite"></section>
  </main>

  <script>
    const skills = [
      "Web Design",
      "Video Editing",
      "Excel & Data Entry",
      "AI Tools",
      "Graphic Design",
      "Web Development",
      "Freelancing"
    ];

    const skillsContainer = document.getElementById("skills");
    const message = document.getElementById("message");

    skills.forEach(function(skill) {
      const card = document.createElement("article");
      card.className = "card";

      const title = document.createElement("h3");
      title.textContent = skill;

      const button = document.createElement("button");
      button.textContent = "Start Learning";

      button.addEventListener("click", function() {
        message.style.display = "block";
        message.textContent = "Welcome to " + skill + "! Lessons are coming soon.";
        message.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });

      card.appendChild(title);
      card.appendChild(button);
      skillsContainer.appendChild(card);
    });
  </script>
</body>
</html>
